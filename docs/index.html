<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hassi</title>
<link rel='stylesheet' href="/css/style.css">
</head>

<body>

<script src="js/hassi/0.0.1/data.js"></script>
<script src="/libs/chartjs/4.5.1/chart.umd.min.js" defer></script>
<script type="importmap">
{
  "imports": {
    "endap": "/js/endap/0.0.5/endap.min.js"
  }
}
</script>

<!-- code begins -->

<div id="cnt1"></div>


<script type=module>
import { Console as CLI } from "endap"
const consoles = CLI.create("40px");

const cnt = document.getElementById("cnt1");
cnt.append(consoles.el);

consoles.ver();
</script>


<pre class="mermaid">
flowchart
  %% maps
  W --"required by"--> P & H
  P --"produce"--> F
  H --"need"--> F
  F --"can contaminate" --> W

  %% elements
  W(("Water"))
  P{"Plant"}
  F["Food"]
  H(["Human"])
</pre>


<!-- code ends -->

<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10.9.8/dist/mermaid.esm.min.mjs";

  mermaid.initialize({
    startOnLoad: false,
    theme: "neutral"
  });

  document.addEventListener("DOMContentLoaded", async () => {
    const element = document.querySelector(".mermaid");

    console.log("ELEMENT:", element);
    console.log("textContent:", JSON.stringify(element.textContent));
    console.log("innerHTML:", JSON.stringify(element.innerHTML));

    try {
      console.log("detectType:",
        mermaid.detectType(element.textContent)
      );

      await mermaid.run({
        nodes: [element]
      });
    } catch (error) {
      console.error("MERMAID ERROR:", error);
    }
  });
</script>

</body>
</html>
